<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floater</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #box {
    position: fixed; inset: 0;
    background: rgba(24, 26, 32, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    display: flex; flex-direction: column;
    padding: 10px 12px;
    gap: 8px;
  }
  #title { font-size: 11px; color: #8a8f9a; text-align: center; letter-spacing: 0.5px; }
  #voice-line {
    font-size: 11px; color: #6f7582; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #voice-line b { color: #9aa0ad; font-weight: 600; }
  #actions { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 8px 0; border: none; border-radius: 8px;
    font-size: 13px; cursor: pointer; color: #fff;
    background: rgba(255, 255, 255, 0.10);
    transition: background 0.15s;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.20); }
  .btn:active { background: rgba(255, 255, 255, 0.26); }
  #btn-read { background: #2f7bff; }
  #btn-read:hover { background: #3d86ff; }
</style>
</head>
<body>
<div id="box">
  <div id="title">已选中 · <span id="count">0</span> 字</div>
  <div id="voice-line">音色：<b id="voice">-</b></div>
  <div id="actions">
    <button id="btn-read" class="btn">朗读</button>
    <button id="btn-copy" class="btn">复制</button>
    <button id="btn-crop" class="btn">框选</button>
    <button id="btn-settings" class="btn">设置</button>
  </div>
</div>
<script type="module" src="floater.js"></script>
</body>
</html>
