<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floater</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: var(--floater-bg, rgba(30, 32, 38, 0.84));
    border-radius: 22px;
    pointer-events: none;
  }
  #bar {
    position: fixed; inset: 0;
    display: flex; align-items: center;
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 22px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    padding: 0 4px;
    gap: 0;
  }
  .btn {
    width: 36px; height: 36px;
    border: none; border-radius: 8px;
    cursor: pointer;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.10); }
  .btn:active { background: rgba(255, 255, 255, 0.16); }
  .btn svg { width: 18px; height: 18px; fill: none; stroke: #d0d2d6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn:hover svg { stroke: #fff; }
  .sep {
    width: 1px; height: 20px;
    background: rgba(255, 255, 255, 0.10);
    margin: 0 2px;
  }
  #info {
    font-size: 11px; color: #6f7582;
    padding: 0 6px 0 4px;
    white-space: nowrap;
  }
  #btn-pause.active svg { stroke: #f0b429; }
  #btn-lock.active svg { stroke: #4fc3f7; }
  #btn-lock.active { background: rgba(79, 195, 247, 0.16); }
</style>
</head>
<body>
<div id="bar">
  <div id="info"><span id="count">0</span> 字</div>
  <div class="sep"></div>
  <button id="btn-read" class="btn" title="朗读">
    <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
  </button>
  <button id="btn-pause" class="btn" title="暂停">
    <svg id="pause-icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    <svg id="play-icon" viewBox="0 0 24 24" style="display:none"><polygon points="6 5 20 12 6 19 6 5"/></svg>
  </button>
  <button id="btn-lock" class="btn" title="锁定当前软件（不捕捉其他软件）">
    <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </button>
  <button id="btn-copy" class="btn" title="复制">
    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
  </button>
  <button id="btn-settings" class="btn" title="设置">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>
<script type="module" src="floater.js"></script>
</body>
</html>
