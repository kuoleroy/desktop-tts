<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 桌宠</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage"></canvas>

<div id="bubble" class="hidden">
  <div class="bubble-tail"></div>
  <div id="bubble-text"></div>
</div>

<div id="status"></div>

<div id="pet-menu" class="hidden">
  <div class="menu-item" data-action="show-panel">显示面板</div>
  <div class="menu-item has-sub">窗口大小
    <div class="submenu" id="size-sub">
      <div class="sub-item" data-scale="1.0">全屏</div>
      <div class="sub-item" data-scale="0.9">9/10</div>
      <div class="sub-item" data-scale="0.8">8/10</div>
      <div class="sub-item" data-scale="0.7">7/10</div>
      <div class="sub-item" data-scale="0.6">6/10</div>
      <div class="sub-item" data-scale="0.5">1/2</div>
      <div class="sub-item" data-scale="0.333">1/3</div>
      <div class="sub-item" data-scale="0.25">1/4</div>
      <div class="sub-item" data-scale="0.2">1/5</div>
    </div>
  </div>
  <div class="menu-item" data-action="reset-size">恢复默认窗口大小</div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="app.js"></script>

</html>
