<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌宠控制台</title>
<link rel="icon" href="data:,">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  user-select: none;
  -webkit-user-select: none;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: #fff;
  border-radius: 14px;
  pointer-events: none;
}
#panel {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
  overflow: hidden;
  animation: pop 0.18s ease-out;
}
@keyframes pop {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid #eee;
  font-size: 13px;
  font-weight: 600;
  color: #333;
  cursor: move;
  -webkit-user-select: none;
  user-select: none;
}
.panel-head:active { cursor: grabbing; }
#p-back {
  border: 1px solid #d9d9d9;
  background: #fff;
  border-radius: 8px;
  padding: 3px 10px;
  font-size: 12px;
  cursor: pointer;
}
#p-back:hover { background: #f0f2f5; }
.panel-body { padding: 10px; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
.panel-body::-webkit-scrollbar { display: none; }
#ptext {
  width: 100%;
  min-height: 60px;
  padding: 8px;
  border: 1px solid #d9d9d9;
  border-radius: 8px;
  font-size: 12px;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  color: #333;
  resize: none;
  overflow: hidden;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}
#ptext:focus { border-color: #1677ff; }
.panel-row { display: flex; gap: 8px; margin-bottom: 8px; }
.p-btn {
  flex: 1;
  padding: 9px 6px;
  border: 1px solid #d9d9d9;
  border-radius: 8px;
  background: #fff;
  font-size: 12px;
  color: #333;
  cursor: pointer;
}
.p-btn:hover { background: #f0f2f5; }
.p-btn.active { background: #1677ff; border-color: #1677ff; color: #fff; }
.p-btn.active:hover { background: #0958d9; }
.p-btn.primary { background: #1677ff; border-color: #1677ff; color: #fff; }
.p-btn.primary:hover { background: #0958d9; }
.p-btn.danger { background: #fff; border-color: #ff4d4f; color: #ff4d4f; }
.p-btn.danger:hover { background: #fff1f0; }
/* 抓取开关样式：开启态高亮，类似单选框按下 */
.p-btn.toggle { background: #fff; }
.p-btn.toggle.active { background: #1677ff; border-color: #1677ff; color: #fff; }
.panel-section {
  border-top: 1px solid #eee;
  border-bottom: 1px solid #eee;
  margin: 8px 0;
  padding: 6px 2px;
}
.panel-section label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: #666;
  padding: 4px 0;
}
.panel-section select {
  font-size: 12px;
  padding: 2px 4px;
  border: 1px solid #ddd;
  border-radius: 6px;
  background: #fff;
  max-width: 130px;
  outline: none;
}
.panel-foot {
  padding: 8px 10px;
  border-top: 1px solid #eee;
}
/* 进度条（暂时隐藏）
.panel-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 2px;
  font-size: 11px;
  color: #666;
}
.panel-progress.hidden { display: none; }
.prog-track {
  flex: 1;
  height: 6px;
  background: #f0f2f5;
  border-radius: 3px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  width: 0%;
  background: #1677ff;
  border-radius: 3px;
  transition: width 0.15s;
}
.prog-label { white-space: nowrap; min-width: 36px; text-align: right; }
*/
</style>
</head>
<body>
<div id="panel">
  <div class="panel-body">
    <div id="panel-hint" style="font-size:11px;color:#666;padding:4px 2px;min-height:16px;text-align:center;"></div>
    <div class="panel-row">
      <textarea id="ptext" rows="4" placeholder="输入要朗读 / 导出的文本...">你好，我是桌面小精灵。选中文字，我就能帮你朗读出来。</textarea>
    </div>
    <div class="panel-row">
      <button class="p-btn" id="p-read">朗读</button>
      <button class="p-btn" id="p-stop">停止</button>
    </div>
    <div class="panel-row">
      <button class="p-btn" id="p-export">导出 MP3</button>
      <button class="p-btn toggle" id="p-grab">抓取</button>
    </div>
    <!-- 进度条（暂时隐藏）
    <div class="panel-progress" id="prog-wrap">
      <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
      <span class="prog-label" id="prog-label"></span>
    </div>
    -->
    <div class="panel-section" style="display:flex;gap:6px;align-items:center;">
      <select id="sel-voice" style="flex:1;font-size:12px;padding:2px 4px;border:1px solid #ddd;border-radius:6px;background:#fff;outline:none;">
        <option value="zh-CN-XiaoxiaoNeural">晓晓（自然女声·在线）</option>
        <option value="zh-CN-YunxiNeural">云希（阳光男声·在线）</option>
        <option value="zh-CN-YunyangNeural">云扬（沉稳男声·在线）</option>
        <option value="zh-CN-XiaoyiNeural">晓伊（活泼女声·在线）</option>
        <option value="zh-CN-YunjianNeural">云健（运动男声·在线）</option>
        <option value="local:Microsoft Xiaoxiao (Natural)">晓晓·本地自然音（离线）</option>
        <option value="local:Microsoft Yunxi (Natural)">云希·本地自然音（离线）</option>
      </select>
      <select id="sel-rate" style="flex:0 0 70px;font-size:12px;padding:2px 4px;border:1px solid #ddd;border-radius:6px;background:#fff;outline:none;">
        <option value="-2">很慢</option>
        <option value="-1">慢</option>
        <option value="0" selected>正常</option>
        <option value="1">快</option>
        <option value="2">很快</option>
      </select>
      <select id="sel-pitch" style="flex:0 0 70px;font-size:12px;padding:2px 4px;border:1px solid #ddd;border-radius:6px;background:#fff;outline:none;">
        <option value="low">低沉</option>
        <option value="medium" selected>适中</option>
        <option value="high">偏高</option>
      </select>
    </div>
    <div style="border-top:1px solid #eee;padding:6px 2px;margin-top:4px;">
      <div style="font-size:11px;color:#999;margin-bottom:4px;">跳过注入的应用（不注入 Ctrl+C）</div>
      <select id="skip-select" style="width:100%;font-size:11px;padding:4px 6px;border:1px solid #ddd;border-radius:6px;background:#fff;outline:none;color:#666;">
        <option value="">（暂无跳过的应用）</option>
      </select>
      <div class="panel-row" style="gap:4px;margin:6px 0 0;">
        <button class="p-btn" id="p-skip-pick" style="font-size:11px;padding:6px 4px;">+ 选取窗口</button>
        <button class="p-btn danger" id="p-skip-release" style="font-size:11px;padding:6px 4px;">释放所选</button>
      </div>
    </div>
    <div style="border-top:1px solid #eee;padding:6px 2px;margin-top:4px;">
      <div style="font-size:11px;color:#999;margin-bottom:4px;">跳过抓取的应用（不读取该窗口文字）</div>
      <select id="grab-skip-select" style="width:100%;font-size:11px;padding:4px 6px;border:1px solid #ddd;border-radius:6px;background:#fff;outline:none;color:#666;">
        <option value="">（暂无跳过的应用）</option>
      </select>
      <div class="panel-row" style="gap:4px;margin:6px 0 0;">
        <button class="p-btn" id="p-grab-skip-pick" style="font-size:11px;padding:6px 4px;">+ 选取窗口</button>
        <button class="p-btn danger" id="p-grab-skip-release" style="font-size:11px;padding:6px 4px;">释放所选</button>
      </div>
    </div>
    <div style="border-top:1px solid #eee;padding:6px 2px;margin-top:4px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <span style="font-size:11px;color:#999;">模型穿透</span>
        <button class="p-btn toggle" id="p-ct" style="font-size:11px;padding:4px 10px;">穿透</button>
      </div>
      <div style="font-size:11px;color:#999;margin:4px 0 2px;">快捷键（点击后按下新组合键）</div>
      <div style="display:flex;gap:4px;">
        <button class="p-btn" id="p-hk-panel" style="flex:1;font-size:10px;padding:5px 2px;">面板:Ctrl+Shift+T</button>
        <button class="p-btn" id="p-hk-ct" style="flex:1;font-size:10px;padding:5px 2px;">穿透:Ctrl+Shift+X</button>
      </div>
      <div style="border-top:1px solid #f0f0f0;margin:6px 0 4px;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <span style="font-size:11px;color:#999;">悬浮框背景</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <input type="color" id="p-fl-color" value="#1e2026" title="背景色"
               style="width:26px;height:20px;padding:0;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;">
        <input type="range" id="p-fl-op" min="0" max="100" value="84" title="透明度"
               style="flex:1;height:4px;accent-color:#1677ff;">
        <span id="p-fl-op-lb" style="font-size:10px;color:#999;width:30px;text-align:right;">84%</span>
      </div>
    </div>
  </div>
  <div class="panel-foot">
    <button class="p-btn danger" id="p-quit">退出</button>
  </div>
</div>
<script>
window.__TAURI__ && window.__TAURI__.core && document.currentScript;
</script>
<script src="panel.js"></script>
</body>
</html>
