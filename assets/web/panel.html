<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌宠控制台</title>
<link rel="icon" href="data:,">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  user-select: none;
  -webkit-user-select: none;
}
#panel {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: #fff;
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
  overflow: hidden;
  animation: pop 0.18s ease-out;
}
@keyframes pop {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid #eee;
  font-size: 13px;
  font-weight: 600;
  color: #333;
  cursor: move;
  -webkit-user-select: none;
  user-select: none;
}
.panel-head:active { cursor: grabbing; }
#p-back {
  border: 1px solid #d9d9d9;
  background: #fff;
  border-radius: 8px;
  padding: 3px 10px;
  font-size: 12px;
  cursor: pointer;
}
#p-back:hover { background: #f0f2f5; }
.panel-body { padding: 10px; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
.panel-body::-webkit-scrollbar { display: none; }
#ptext {
  width: 100%;
  min-height: 60px;
  padding: 8px;
  border: 1px solid #d9d9d9;
  border-radius: 8px;
  font-size: 12px;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  color: #333;
  resize: none;
  overflow: hidden;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}
#ptext:focus { border-color: #1677ff; }
.panel-row { display: flex; gap: 8px; margin-bottom: 8px; }
.p-btn {
  flex: 1;
  padding: 9px 6px;
  border: 1px solid #d9d9d9;
  border-radius: 8px;
  background: #fff;
  font-size: 12px;
  color: #333;
  cursor: pointer;
}
.p-btn:hover { background: #f0f2f5; }
.p-btn.active { background: #1677ff; border-color: #1677ff; color: #fff; }
.p-btn.active:hover { background: #0958d9; }
.p-btn.primary { background: #1677ff; border-color: #1677ff; color: #fff; }
.p-btn.primary:hover { background: #0958d9; }
.p-btn.danger { background: #fff; border-color: #ff4d4f; color: #ff4d4f; }
.p-btn.danger:hover { background: #fff1f0; }
/* 抓取开关样式：开启态高亮，类似单选框按下 */
.p-btn.toggle { background: #fff; }
.p-btn.toggle.active { background: #1677ff; border-color: #1677ff; color: #fff; }
.panel-section {
  border-top: 1px solid #eee;
  border-bottom: 1px solid #eee;
  margin: 8px 0;
  padding: 6px 2px;
}
.panel-section label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: #666;
  padding: 4px 0;
}
.panel-section select {
  font-size: 12px;
  padding: 2px 4px;
  border: 1px solid #ddd;
  border-radius: 6px;
  background: #fff;
  max-width: 130px;
  outline: none;
}
.panel-foot {
  padding: 8px 10px;
  border-top: 1px solid #eee;
}
.panel-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 2px;
  font-size: 11px;
  color: #666;
}
.panel-progress.hidden { display: none; }
.prog-track {
  flex: 1;
  height: 6px;
  background: #f0f2f5;
  border-radius: 3px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  width: 0%;
  background: #1677ff;
  border-radius: 3px;
  transition: width 0.3s linear;
}
.prog-label { min-width: 60px; text-align: right; }
</style>
</head>
<body>
<div id="panel">
  <div class="panel-body">
    <div id="panel-hint" style="font-size:11px;color:#666;padding:4px 2px;min-height:16px;text-align:center;"></div>
    <div class="panel-row">
      <textarea id="ptext" rows="4" placeholder="输入要朗读 / 导出的文本...">你好，我是桌面小精灵。选中文字，我就能帮你朗读出来。</textarea>
    </div>
    <div class="panel-row">
      <button class="p-btn" id="p-read">朗读</button>
      <button class="p-btn" id="p-pause">暂停</button>
      <button class="p-btn" id="p-stop">停止</button>
    </div>
    <div class="panel-row">
      <button class="p-btn" id="p-export">导出 MP3</button>
      <button class="p-btn toggle" id="p-grab">抓取</button>
    </div>
    <div class="panel-progress" id="prog-wrap">
      <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
      <span class="prog-label" id="prog-label"></span>
    </div>
    <div class="panel-section">
      <label>音色 <select id="sel-voice">
        <option value="zh-CN-XiaoxiaoNeural">晓晓（自然女声·在线）</option>
        <option value="zh-CN-YunxiNeural">云希（阳光男声·在线）</option>
        <option value="zh-CN-YunyangNeural">云扬（沉稳男声·在线）</option>
        <option value="zh-CN-XiaoyiNeural">晓伊（活泼女声·在线）</option>
        <option value="zh-CN-YunjianNeural">云健（运动男声·在线）</option>
        <option value="local:Microsoft Xiaoxiao (Natural)">晓晓·本地自然音（离线）</option>
        <option value="local:Microsoft Yunxi (Natural)">云希·本地自然音（离线）</option>
      </select></label>
      <label>语速 <select id="sel-rate">
        <option value="-2">很慢</option>
        <option value="-1">慢</option>
        <option value="0" selected>正常</option>
        <option value="1">快</option>
        <option value="2">很快</option>
      </select></label>
      <label>语调 <select id="sel-pitch">
        <option value="low">低沉</option>
        <option value="medium" selected>适中</option>
        <option value="high">偏高</option>
      </select></label>
    </div>
    <div style="border-top:1px solid #eee;padding:6px 2px;margin-top:4px;">
      <div style="font-size:11px;color:#999;margin-bottom:4px;">跳过注入的应用</div>
      <div id="skip-list" style="font-size:11px;color:#666;margin-bottom:6px;max-height:80px;overflow-y:auto;"></div>
      <div class="panel-row" style="gap:4px;margin:0;">
        <button class="p-btn" id="p-skip-manage" style="font-size:11px;padding:6px 4px;">管理</button>
        <button class="p-btn" id="p-skip-refresh" style="font-size:11px;padding:6px 4px;">刷新</button>
      </div>
    </div>
  </div>
  <div class="panel-foot">
    <button class="p-btn danger" id="p-quit">退出</button>
  </div>
</div>

<!-- 跳过管理弹窗 -->
<div id="skip-modal" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.3);align-items:center;justify-content:center;font-family:Microsoft YaHei,PingFang SC,sans-serif;">
  <div style="background:#fff;border-radius:12px;padding:14px;width:260px;max-height:300px;box-shadow:0 8px 24px rgba(0,0,0,0.25);display:flex;flex-direction:column;">
    <div style="font-size:13px;font-weight:600;color:#333;margin-bottom:8px;">管理跳过应用</div>
    <div id="skip-modal-list" style="flex:1;overflow-y:auto;font-size:12px;color:#666;margin-bottom:8px;min-height:40px;"></div>
    <div class="panel-row" style="gap:6px;margin:0;">
      <button class="p-btn" id="p-skip-modal-pick" style="font-size:11px;padding:6px 4px;">+ 选取窗口</button>
      <button class="p-btn" id="p-skip-modal-close" style="font-size:11px;padding:6px 4px;">关闭</button>
      <button class="p-btn danger" id="p-skip-modal-clear" style="font-size:11px;padding:6px 4px;">释放全部</button>
    </div>
  </div>
</div>
<script>
window.__TAURI__ && window.__TAURI__.core && document.currentScript;
</script>
<script src="panel.js"></script>
</body>
</html>
