<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌宠控制台</title>
<link rel="icon" href="data:,">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  user-select: none;
  -webkit-user-select: none;
}
#panel {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: #fff;
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
  overflow: hidden;
  animation: pop 0.18s ease-out;
}
@keyframes pop {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid #eee;
  font-size: 13px;
  font-weight: 600;
  color: #333;
  cursor: move;
  -webkit-user-select: none;
  user-select: none;
}
.panel-head:active { cursor: grabbing; }
#p-back {
  border: 1px solid #d9d9d9;
  background: #fff;
  border-radius: 8px;
  padding: 3px 10px;
  font-size: 12px;
  cursor: pointer;
}
#p-back:hover { background: #f0f2f5; }
.panel-body { padding: 10px; overflow-y: auto; }
#ptext {
  width: 100%;
  min-height: 60px;
  padding: 8px;
  border: 1px solid #d9d9d9;
  border-radius: 8px;
  font-size: 12px;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  color: #333;
  resize: vertical;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}
#ptext:focus { border-color: #1677ff; }
.panel-row { display: flex; gap: 8px; margin-bottom: 8px; }
.p-btn {
  flex: 1;
  padding: 9px 6px;
  border: 1px solid #d9d9d9;
  border-radius: 8px;
  background: #fff;
  font-size: 12px;
  color: #333;
  cursor: pointer;
}
.p-btn:hover { background: #f0f2f5; }
.p-btn.active { background: #1677ff; border-color: #1677ff; color: #fff; }
.p-btn.active:hover { background: #0958d9; }
.p-btn.primary { background: #1677ff; border-color: #1677ff; color: #fff; }
.p-btn.primary:hover { background: #0958d9; }
.p-btn.danger { background: #fff; border-color: #ff4d4f; color: #ff4d4f; }
.p-btn.danger:hover { background: #fff1f0; }
/* 抓取开关样式：开启态高亮，类似单选框按下 */
.p-btn.toggle { background: #fff; }
.p-btn.toggle.active { background: #1677ff; border-color: #1677ff; color: #fff; }
.panel-section {
  border-top: 1px solid #eee;
  border-bottom: 1px solid #eee;
  margin: 8px 0;
  padding: 6px 2px;
}
.panel-section label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: #666;
  padding: 4px 0;
}
.panel-section select {
  font-size: 12px;
  padding: 2px 4px;
  border: 1px solid #ddd;
  border-radius: 6px;
  background: #fff;
  max-width: 130px;
  outline: none;
}
.panel-foot {
  padding: 8px 10px;
  border-top: 1px solid #eee;
}
</style>
</head>
<body>
<div id="panel">
  <div class="panel-head">
    <span>桌宠控制台</span>
    <!-- <span id="panel-hint" style="font-size:11px;font-weight:400;color:#999;"></span> -->
    <button id="p-back">返回观赏</button>
  </div>
  <div class="panel-body">
    <div class="panel-row">
      <textarea id="ptext" rows="4" placeholder="输入要朗读 / 导出的文本...">你好，我是桌面小精灵。选中文字，我就能帮你朗读出来。</textarea>
    </div>
    <div class="panel-row">
      <button class="p-btn" id="p-read">朗读</button>
      <button class="p-btn" id="p-pause">暂停</button>
      <button class="p-btn" id="p-stop">停止</button>
    </div>
    <div class="panel-row">
      <button class="p-btn" id="p-export">导出 MP3</button>
      <button class="p-btn toggle" id="p-grab">抓取</button>
    </div>
    <div class="panel-section">
      <label>音色 <select id="sel-voice">
        <option value="zh-CN-XiaoxiaoNeural">晓晓（温柔女声）</option>
        <option value="zh-CN-YunxiNeural">云希（阳光男声）</option>
        <option value="zh-CN-YunyangNeural">云扬（沉稳男声）</option>
        <option value="zh-CN-XiaoyiNeural">晓伊（活泼女声）</option>
        <option value="zh-CN-YunjianNeural">云健（运动男声）</option>
        <option value="zh-CN-XiaomengNeural">晓梦（可爱女声）</option>
        <option value="zh-CN-XiaomoNeural">晓墨（文艺女声）</option>
        <option value="zh-CN-XiaoweiNeural">晓薇（甜美女声）</option>
        <option value="zh-CN-XiaoxuanNeural">晓萱（活泼女声）</option>
        <option value="zh-CN-XiaozhenNeural">晓甄（知性女声）</option>
      </select></label>
      <label>语速 <select id="sel-rate">
        <option value="-2">很慢</option>
        <option value="-1">慢</option>
        <option value="0" selected>正常</option>
        <option value="1">快</option>
        <option value="2">很快</option>
      </select></label>
      <label>语调 <select id="sel-pitch">
        <option value="low">低沉</option>
        <option value="medium" selected>适中</option>
        <option value="high">偏高</option>
      </select></label>
    </div>
  </div>
  <div class="panel-foot">
    <button class="p-btn danger" id="p-quit">退出</button>
  </div>
</div>
<script>
window.__TAURI__ && window.__TAURI__.core && document.currentScript;
</script>
<script src="panel.js"></script>
</body>
</html>
