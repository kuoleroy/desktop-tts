<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lock</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #lock {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
    border: none;
    outline: none;
    transition: background 0.15s;
  }
  #lock:hover { background: rgba(0,0,0,0.75); }
</style>
</head>
<body>
<button id="lock" title="点击切换穿透/交互">🔓</button>
<script>
function whenTauriReady(cb) {
  if (window.__TAURI__?.core) return cb();
  const t = setInterval(() => {
    if (window.__TAURI__?.core) { clearInterval(t); cb(); }
  }, 50);
  setTimeout(() => clearInterval(t), 5000);
}
const btn = document.getElementById("lock");
function setIcon(clickThrough) {
  btn.textContent = clickThrough ? "🔓" : "🔒";
  btn.title = clickThrough ? "当前可穿透（不挡鼠标），点击切换为可交互" : "当前可交互，点击切换为穿透";
}
whenTauriReady(() => {
  window.__TAURI__.core.invoke("get_click_through").then(setIcon);
  window.__TAURI__.event.listen("click-through-changed", (e) => setIcon(!!e.payload));
  btn.addEventListener("click", () => {
    window.__TAURI__.core.invoke("toggle_click_through").then(setIcon);
  });
});
</script>
</body>
</html>
