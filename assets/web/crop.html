<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>框选</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; cursor: crosshair; user-select: none;
      background: transparent;
    }
    #mask { position: fixed; inset: 0; background: rgba(0,0,0,0.35); }
    #box {
      position: fixed; border: 2px solid #4da3ff;
      background: rgba(77,163,255,0.10);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
      display: none; z-index: 10;
    }
    #hint {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      color: #fff; font: 14px/1.6 system-ui, sans-serif;
      background: rgba(0,0,0,0.55); padding: 6px 14px; border-radius: 6px;
      z-index: 20; pointer-events: none; white-space: nowrap;
    }
    #cancel {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 30; pointer-events: auto;
      background: rgba(60,60,60,0.85); color: #fff; border: none;
      padding: 8px 22px; border-radius: 6px; font-size: 13px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="mask"></div>
  <div id="box"></div>
  <div id="hint">按住鼠标左键拖拽框选要识别的文字区域，松开自动识别；Esc 取消</div>
  <button id="cancel">取消 (Esc)</button>
  <script src="crop.js"></script>
</body>
</html>
